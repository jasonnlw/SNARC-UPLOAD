<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wikidata to QS Mapper</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        textarea { width: 100%; height: 100px; margin-bottom: 1rem; padding: 0.5rem; box-sizing: border-box; }
        button { padding: 0.5rem 1rem; background: #0366d6; color: white; border: none; cursor: pointer; }
        button:hover { background: #005cc5; }
        .log { background: #f6f8fa; padding: 1rem; white-space: pre-wrap; font-family: monospace; max-height: 400px; overflow-y: auto; margin-top: 1rem;}
        .error { color: #d73a49; font-weight: bold; }
        .warning { color: #b08800; }
        .panel { border: 1px solid #ddd; padding: 1rem; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>Wikidata to QuickStatements Mapper</h2>
    
    <div class="panel">
        <p><strong>Enter Wikidata QIDs (comma or newline separated):</strong></p>
        <textarea id="qids" placeholder="Q42, Q6581097..."></textarea>
        <button onclick="processItems()" id="btnProcess">Map Data & Generate QS CSV</button>
    </div>

    <div id="output" class="log"></div>

    <script>
        const maps = {};
        const mapFiles = [
            'Mappings for WD-SNARC tool - Property Map.csv',
            'Mappings for WD-SNARC tool - Occupations Map.csv',
            'Mappings for WD-SNARC tool - Instance of Map.csv',
            'Mappings for WD-SNARC tool - Family Name Map.csv',
            'Mappings for WD-SNARC tool - Given Name Map.csv',
            'Mappings for WD-SNARC tool - Language Map.csv'
        ];

        async function loadMaps() {
            for (const file of mapFiles) {
                try {
                    const response = await fetch(file);
                    if (!response.ok) continue;
                    const csv = await response.text();
                    Papa.parse(csv, {
                        header: true,
                        complete: function(results) {
                            const key = file.includes('Property') ? 'Property' : 'Entity';
                            if (!maps[key]) maps[key] = {};
                            results.data.forEach(row => {
                                const values = Object.values(row);
                                if(values[0] && values[1]) maps[key][values[0].trim()] = values[1].trim();
                            });
                        }
                    });
                } catch (e) {
                    console.warn(`Failed to load ${file}`);
                }
            }
            if (!maps['Entity']) maps['Entity'] = {};
            maps['Entity']['Q6581097'] = 'Q33';
            maps['Entity']['Q6581072'] = 'Q34';
        }
        loadMaps();

        const log = (msg, type = 'info') => {
            const el = document.getElementById('output');
            let colorClass = type === 'error' ? 'error' : (type === 'warning' ? 'warning' : '');
            el.innerHTML += `<span class="${colorClass}">${msg}</span><br>`;
            el.scrollTop = el.scrollHeight;
        };
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        async function processItems() {
            document.getElementById('output').innerHTML = '';
            document.getElementById('btnProcess').disabled = true;
            
            const input = document.getElementById('qids').value;
            const qids = input.split(/[\s,]+/).filter(q => q.match(/^Q\d+$/i));
            
            if (qids.length === 0) {
                document.getElementById('btnProcess').disabled = false;
                return log('No valid QIDs found.', 'error');
            }
            log(`Processing ${qids.length} items...`);

            const batchSize = qids.length > 10 ? 50 : 10;
            let allRows = [];
            let columns = new Set(['qid', 'Len', 'Lcy', 'Den', 'Dcy']); 

            for (let i = 0; i < qids.length; i += batchSize) {
                const batch = qids.slice(i, i + batchSize);
                const url = `https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${batch.join('|')}&format=json&origin=*`;
                
                try {
                    const res = await fetch(url);
                    const data = await res.json();
                    await sleep(qids.length > 10 ? 1000 : 200); 

                    for (const qid of batch) {
                        const entity = data.entities[qid];
                        if (!entity || entity.missing) continue;
                        
                        let itemRows = [];
                        // Base row with labels and descriptions
                        itemRows[0] = { 
                            qid: qid,
                            Len: entity.labels?.en?.value || '',
                            Lcy: entity.labels?.cy?.value || '',
                            Den: entity.descriptions?.en?.value || '',
                            Dcy: entity.descriptions?.cy?.value || ''
                        };

                        for (const [prop, claims] of Object.entries(entity.claims)) {
                            const snarcProp = maps['Property'][prop];
                            if (!snarcProp) continue;
                            columns.add(snarcProp);

                            // Process multiple claims for the same property using QS multi-row stacking
                            for (let index = 0; index < claims.length; index++) {
                                const claim = claims[index];
                                const val = claim.mainsnak.datavalue?.value;
                                if (!val) continue;

                                if (!itemRows[index]) itemRows[index] = { qid: qid };

                                let finalValue = '';
                                if (val.id) { 
                                    let mappedEntity = maps['Entity'][val.id];
                                    if (mappedEntity) {
                                        finalValue = mappedEntity;
                                    } else {
                                        finalValue = 'PENDING_CHECK:' + val.id; 
                                    }
                                } else if (val.time) {
                                    // Quickstatements Time format
                                    finalValue = `${val.time}/${val.precision}`;
                                } else if (val.text && val.language) {
                                    // Quickstatements Monolingual Text format
                                    finalValue = `${val.language}:"${val.text}"`;
                                } else {
                                    finalValue = val;
                                }
                                itemRows[index][snarcProp] = finalValue;
                            }
                        }
                        allRows.push(...itemRows);
                    }
                } catch (err) {
                    log(`API Error: ${err.message}`, 'error');
                }
            }

            // Resolve unmapped P12749 Fallbacks
            for (let i = 0; i < allRows.length; i++) {
                let row = allRows[i];
                for (let col of columns) {
                    if (row[col] && typeof row[col] === 'string' && row[col].startsWith('PENDING_CHECK:')) {
                        const targetId = row[col].split(':')[1];
                        try {
                            const fallbackRes = await fetch(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${targetId}&props=claims&format=json&origin=*`);
                            const fallbackData = await fallbackRes.json();
                            const p12749 = fallbackData.entities[targetId]?.claims['P12749'];
                            
                            if (p12749) {
                                row[col] = p12749[0].mainsnak.datavalue.value;
                            } else {
                                log(`Missing mapping for ${targetId} on item ${row.qid}. Value left blank.`, 'warning');
                                row[col] = ''; 
                            }
                        } catch(e) {
                            row[col] = '';
                        }
                        await sleep(100); 
                    }
                }
            }

            const csvOutput = Papa.unparse(allRows, { columns: Array.from(columns) });
            downloadBlob(csvOutput, 'quickstatements_data.csv', 'text/csv');
            
            log('✅ QS CSV generated and downloaded successfully.');
            document.getElementById('btnProcess').disabled = false;
        }

        function downloadBlob(content, filename, contentType) {
            const blob = new Blob([content], { type: contentType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
