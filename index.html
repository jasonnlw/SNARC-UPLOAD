<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wikidata to QS Mapper</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        input[type="text"] { width: 100%; margin-bottom: 1rem; padding: 0.5rem; box-sizing: border-box; font-size: 1.1em; }
        textarea { width: 100%; padding: 0.5rem; box-sizing: border-box; }
        button { padding: 0.5rem 1rem; background: #0366d6; color: white; border: none; cursor: pointer; font-size: 1em; margin-right: 0.5rem; }
        button:hover { background: #005cc5; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .log { background: #f6f8fa; padding: 1rem; white-space: pre-wrap; font-family: monospace; max-height: 400px; overflow-y: auto; margin-top: 1rem; border-radius: 5px; }
        .error { color: #d73a49; font-weight: bold; }
        .warning { color: #b08800; font-weight: bold; }
        .panel { border: 1px solid #ddd; padding: 1rem; border-radius: 5px; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <h2>Wikidata to QuickStatements Mapper</h2>
    
    <div class="panel">
        <p><strong>Enter a single Wikidata QID:</strong></p>
        <input type="text" id="qidInput" placeholder="e.g., Q42">
        <button onclick="processItem()" id="btnProcess">Map Data</button>
    </div>

    <div class="panel" id="resultPanel" style="display: none;">
        <p><strong>QuickStatements Output:</strong></p>
        <textarea id="qsOutput" readonly style="height: 150px; font-family: monospace; white-space: pre; overflow-x: auto; margin-bottom: 1rem;"></textarea>
        <button onclick="copyOutput()" id="btnCopy">Copy to Clipboard</button>
        <button onclick="downloadOutput()" id="btnDownload">Download CSV</button>
    </div>

    <div id="output" class="log"></div>

    <script>
        const maps = { Property: {}, Entity: {} };
        const mapFiles = [
            'Mappings for WD-SNARC tool - Property Map.csv',
            'Mappings for WD-SNARC tool - Occupations Map.csv',
            'Mappings for WD-SNARC tool - Instance of Map.csv',
            'Mappings for WD-SNARC tool - Family Name Map.csv',
            'Mappings for WD-SNARC tool - Given Name Map.csv',
            'Mappings for WD-SNARC tool - Language Map.csv'
        ];

        let currentCsvOutput = '';
        let currentQid = '';

        async function loadMaps() {
            for (const file of mapFiles) {
                try {
                    const response = await fetch(file);
                    if (!response.ok) continue;
                    const csv = await response.text();
                    Papa.parse(csv, {
                        header: true,
                        complete: function(results) {
                            const key = file.includes('Property') ? 'Property' : 'Entity';
                            results.data.forEach(row => {
                                const values = Object.values(row);
                                if(values[0] && values[1]) maps[key][values[0].trim()] = values[1].trim();
                            });
                        }
                    });
                } catch (e) {
                    console.warn(`Failed to load ${file}`);
                }
            }
            // Hardcoded mappings
            maps['Entity']['Q6581097'] = 'Q33';
            maps['Entity']['Q6581072'] = 'Q34';
            maps['Property']['P18'] = 'P31'; // Image property fallback
        }
        loadMaps();

        const log = (msg, type = 'info') => {
            const el = document.getElementById('output');
            let colorClass = type === 'error' ? 'error' : (type === 'warning' ? 'warning' : '');
            el.innerHTML += `<span class="${colorClass}">${msg}</span><br>`;
            el.scrollTop = el.scrollHeight;
        };

        async function checkP12749(wdId) {
            try {
                const res = await fetch(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${wdId}&props=claims&format=json&origin=*`);
                const data = await res.json();
                const p12749 = data.entities[wdId]?.claims['P12749'];
                if (p12749) return p12749[0].mainsnak.datavalue.value;
            } catch(e) {}
            return null;
        }

        async function processItem() {
            document.getElementById('output').innerHTML = '';
            document.getElementById('btnProcess').disabled = true;
            document.getElementById('resultPanel').style.display = 'none';
            currentCsvOutput = '';
            currentQid = '';
            
            const input = document.getElementById('qidInput').value.trim();
            const match = input.match(/^Q\d+$/i);
            
            if (!match) {
                document.getElementById('btnProcess').disabled = false;
                return log('Please enter a valid single QID (e.g., Q42).', 'error');
            }
            
            const qid = match[0].toUpperCase();
            log(`Processing item ${qid}...`);

            try {
                const url = `https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${qid}&format=json&origin=*`;
                const res = await fetch(url);
                const data = await res.json();
                const entity = data.entities[qid];

                if (!entity || entity.missing) {
                    throw new Error('Item not found on Wikidata.');
                }

                let headers = ['qid'];
                let row = ['']; // qid column is always left blank for new item creation

                // 1. Process Labels and Descriptions (Skip entirely if empty)
                const Len = entity.labels?.en?.value;
                const Lcy = entity.labels?.cy?.value;
                const Den = entity.descriptions?.en?.value;
                const Dcy = entity.descriptions?.cy?.value;

                if (Len) { headers.push('Len'); row.push(Len); }
                if (Lcy) { headers.push('Lcy'); row.push(Lcy); }
                if (Den) { headers.push('Den'); row.push(Den); }
                if (Dcy) { headers.push('Dcy'); row.push(Dcy); }

                // 2. Generate P62 Statement with full Wikidata URL
                headers.push('P62');
                row.push('"' + `http://www.wikidata.org/entity/${qid}` + '"');

                // 3. Process Mapped Claims
                for (const [prop, claims] of Object.entries(entity.claims)) {
                    const snarcProp = maps['Property'][prop];
                    if (!snarcProp) continue;

                    for (const claim of claims) {
                        const val = claim.mainsnak.datavalue?.value;
                        // Strict check to ensure 0s are not falsy-skipped
                        if (val === undefined || val === null || val === '') continue;

                        let finalValue = null;

                        if (val.id) { // Entity
                            let mappedEntity = maps['Entity'][val.id];
                            if (mappedEntity) {
                                finalValue = mappedEntity;
                            } else {
                                const fallbackId = await checkP12749(val.id);
                                if (fallbackId) {
                                    finalValue = fallbackId;
                                } else {
                                    log(`Missing mapping for ${val.id} (Property: ${snarcProp}). Column omitted.`, 'warning');
                                    continue;
                                }
                            }
                        } else if (val.time) { // Dates/Times
                            finalValue = `${val.time}/${val.precision}`;
                        } else if (val.text && val.language) { // Monolingual text
                            finalValue = `${val.language}:"${val.text}"`;
                        } else if (typeof val === 'object' && val.latitude !== undefined && val.longitude !== undefined) { // Coordinates
                            finalValue = `@${val.latitude}/${val.longitude}`;
                        } else if (typeof val === 'object' && val.amount !== undefined) { // Quantity
                            finalValue = val.amount;
                        } else { // Standard Strings, Identifiers, P18 Images
                            finalValue = '"' + String(val) + '"';
                        }

                        if (finalValue !== null) {
                            headers.push(snarcProp);
                            row.push(finalValue);
                        }
                    }
                }

                // Compile CSV using PapaParse
                currentCsvOutput = Papa.unparse([headers, row]);
                currentQid = qid;
                
                // Display the output text area and panels
                document.getElementById('qsOutput').value = currentCsvOutput;
                document.getElementById('resultPanel').style.display = 'block';
                log(`✅ Successfully generated data for ${qid}. Ready to copy or download.`);

            } catch (err) {
                log(`Error: ${err.message}`, 'error');
            }

            document.getElementById('btnProcess').disabled = false;
        }

        function copyOutput() {
            const copyText = document.getElementById('qsOutput');
            copyText.select();
            document.execCommand('copy');
            log('📋 Output copied to clipboard!');
            // Deselect text after copying
            window.getSelection().removeAllRanges();
        }

        function downloadOutput() {
            if (!currentCsvOutput) return;
            const blob = new Blob([currentCsvOutput], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${currentQid}_quickstatements.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
