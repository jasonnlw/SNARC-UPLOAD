<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wikidata to SNARC Mapper</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        textarea { width: 100%; height: 100px; margin-bottom: 1rem; padding: 0.5rem; }
        button { padding: 0.5rem 1rem; background: #0366d6; color: white; border: none; cursor: pointer; }
        button:hover { background: #005cc5; }
        .log { background: #f6f8fa; padding: 1rem; white-space: pre-wrap; font-family: monospace; }
        .error { color: #d73a49; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Wikidata to SNARC Mapper</h2>
    <p>Enter Wikidata QIDs (comma or newline separated):</p>
    <textarea id="qids" placeholder="Q42, Q6581097..."></textarea>
    <button onclick="processItems()">Map Data & Generate Files</button>
    <div id="output" class="log" style="margin-top:1rem;"></div>

    <script>
        const maps = {};
        const mapFiles = [
            'Mappings for WD-SNARC tool - Property Map.csv',
            'Mappings for WD-SNARC tool - Occupations Map.csv',
            'Mappings for WD-SNARC tool - Instance of Map.csv',
            'Mappings for WD-SNARC tool - Family Name Map.csv',
            'Mappings for WD-SNARC tool - Given Name Map.csv',
            'Mappings for WD-SNARC tool - Language Map.csv'
        ];

        // Load all maps on startup
        async function loadMaps() {
            for (const file of mapFiles) {
                const response = await fetch(file);
                const csv = await response.text();
                Papa.parse(csv, {
                    header: true,
                    complete: function(results) {
                        const key = file.includes('Property') ? 'Property' : 'Entity';
                        if (!maps[key]) maps[key] = {};
                        results.data.forEach(row => {
                            const values = Object.values(row);
                            if(values[0] && values[1]) maps[key][values[0].trim()] = values[1].trim();
                        });
                    }
                });
            }
            // Hardcoded P21 mappings
            if (!maps['Entity']) maps['Entity'] = {};
            maps['Entity']['Q6581097'] = 'Q33';
            maps['Entity']['Q6581072'] = 'Q34';
        }
        loadMaps();

        const log = (msg, isError = false) => {
            const el = document.getElementById('output');
            el.innerHTML += `<span class="${isError ? 'error' : ''}">${msg}</span><br>`;
        };

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        async function processItems() {
            document.getElementById('output').innerHTML = '';
            const input = document.getElementById('qids').value;
            const qids = input.split(/[\s,]+/).filter(q => q.match(/^Q\d+$/i));
            
            if (qids.length === 0) return log('No valid QIDs found.', true);
            log(`Processing ${qids.length} items...`);

            // Use bulk fetch logic for sets larger than 10
            const batchSize = qids.length > 10 ? 50 : 10;
            let rows = [];
            let columns = new Set(['item']);
            let missingData = [];

            for (let i = 0; i < qids.length; i += batchSize) {
                const batch = qids.slice(i, i + batchSize);
                const url = `https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${batch.join('|')}&format=json&origin=*`;
                
                try {
                    const res = await fetch(url);
                    const data = await res.json();
                    await sleep(qids.length > 10 ? 1000 : 200); // Throttle bulk calls

                    for (const qid of batch) {
                        const entity = data.entities[qid];
                        if (!entity || entity.missing) continue;
                        
                        let row = { item: qid };
                        for (const [prop, claims] of Object.entries(entity.claims)) {
                            const snarcProp = maps['Property'][prop];
                            if (!snarcProp) continue;

                            columns.add(snarcProp);
                            const val = claims[0].mainsnak.datavalue?.value;
                            
                            if (val?.id) { // Entity
                                let mappedEntity = maps['Entity'][val.id];
                                if (!mappedEntity) {
                                    // P12749 Fallback check
                                    const fallbackRes = await fetch(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${val.id}&props=claims&format=json&origin=*`);
                                    const fallbackData = await fallbackRes.json();
                                    const p12749 = fallbackData.entities[val.id]?.claims['P12749'];
                                    mappedEntity = p12749 ? p12749[0].mainsnak.datavalue.value : null;
                                }
                                if (mappedEntity) {
                                    row[snarcProp] = mappedEntity;
                                } else {
                                    missingData.push(`${qid}: Missing mapping for ${val.id}`);
                                    row[snarcProp] = val.id; // Pass original string
                                }
                            } else {
                                // Strings, Dates, URLs
                                row[snarcProp] = val.time || val;
                            }
                        }
                        rows.push(row);
                    }
                } catch (err) {
                    log(`API Error: ${err.message}`, true);
                }
            }

            if (missingData.length > 0) {
                log('Missing Mappings Found:', true);
                missingData.forEach(m => log(m, true));
            }

            generateFiles(rows, Array.from(columns));
        }

        function generateFiles(rows, columns) {
            const csv = Papa.unparse(rows, { columns });
            const jsonSchema = {
                "@context": "http://www.w3.org/ns/csvw",
                "tables": [{
                    "url": "upload_data.csv",
                    "tableSchema": {
                        "aboutUrl": "http://localhost/entity/{item}",
                        "columns": columns.map(col => col === 'item' ? 
                            { "titles": "item", "name": "item", "datatype": "string" } : 
                            { "titles": col, "propertyUrl": `http://www.wikidata.org/prop/statement/${col}`, "valueUrl": "{"+col+"}" }
                        )
                    }
                }]
            };

            downloadBlob(csv, 'upload_data.csv', 'text/csv');
            downloadBlob(JSON.stringify(jsonSchema, null, 2), 'csv-metadata.json', 'application/json');
            log('✅ Files generated and downloaded successfully.');
        }

        function downloadBlob(content, filename, contentType) {
            const blob = new Blob([content], { type: contentType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
